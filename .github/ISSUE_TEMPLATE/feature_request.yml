name: Feature request
description: Suggest something Cadence should do.
title: "feat: "
labels: ["enhancement", "needs triage"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Voice
        - Playback and mixing
        - Sources
        - Timing
        - API and sessions
        - Analysis
        - Build and deployment
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Tell us what you're trying to do and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
      description: The behaviour or API you have in mind. Request and event shapes are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
  - type: checkboxes
    id: lavalink
    attributes:
      label: Compatibility
      options:
        - label: This would change behaviour that Lavalink v4 clients rely on.
