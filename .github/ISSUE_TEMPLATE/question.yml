name: Question
description: Ask how to set up or use Cadence.
title: "question: "
labels: ["question"]
body:
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What are you trying to do, and what have you tried so far?
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Your setup
      description: How you run Cadence (Docker or native build) and which client library your bot uses.
